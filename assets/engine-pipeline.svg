<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Quote evaluation pipeline and post-confirmation flow" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1C1C1C"/></marker>
    <clipPath id="clip"><rect width="1200" height="470" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="470" fill="#F4F3EF"/>

    <text x="45" y="48" font-size="14" font-weight="800" letter-spacing="2" fill="#1D4ED8">1 · EVALUATE — FIVE PURE ENGINES, ONE ORCHESTRATING SERVICE</text>
    <text x="45" y="68" font-size="12" fill="#444">The browser never supplies prices or totals. Engines take facts in and hand verdicts out — no database, no side effects.</text>

    <!-- lane 1 connectors + packet -->
    <g stroke="#1C1C1C" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M235 155H283"/><path d="M473 155H521"/><path d="M711 155H759"/><path d="M949 155H997"/>
    </g>
    <circle r="7" fill="#1D4ED8" stroke="#1C1C1C" stroke-width="2.5"><animateMotion dur="6s" repeatCount="indefinite" path="M45 155H1155"/></circle>
    <circle r="7" fill="#FACC15" stroke="#1C1C1C" stroke-width="2.5"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M45 155H1155"/></circle>

    <!-- lane 1 blocks (shadow rect then face) -->
    <g font-weight="800" text-anchor="middle">
      <rect x="51" y="116" width="190" height="90" fill="#1C1C1C"/><rect x="45" y="110" width="190" height="90" fill="#fff" stroke="#1C1C1C" stroke-width="3"/>
      <text x="140" y="140" font-size="16" fill="#1C1C1C">Pricing</text><text x="140" y="162" font-size="12" font-weight="400" fill="#444">price from the DB,</text><text x="140" y="179" font-size="12" font-weight="400" fill="#444">never the browser</text>

      <rect x="289" y="116" width="190" height="90" fill="#1C1C1C"/><rect x="283" y="110" width="190" height="90" fill="#fff" stroke="#1C1C1C" stroke-width="3"/>
      <text x="378" y="140" font-size="16" fill="#1C1C1C">Discount</text><text x="378" y="162" font-size="12" font-weight="400" fill="#444">min(tier, category)</text><text x="378" y="179" font-size="12" font-weight="400" fill="#444">overage per line</text>

      <rect x="527" y="116" width="190" height="90" fill="#1C1C1C"/><rect x="521" y="110" width="190" height="90" fill="#fff" stroke="#1C1C1C" stroke-width="3"/>
      <text x="616" y="140" font-size="16" fill="#1C1C1C">Margin</text><text x="616" y="162" font-size="12" font-weight="400" fill="#444">against revenue,</text><text x="616" y="179" font-size="12" font-weight="400" fill="#444">not cost</text>

      <rect x="765" y="116" width="190" height="90" fill="#1C1C1C"/><rect x="759" y="110" width="190" height="90" fill="#FEF08A" stroke="#1C1C1C" stroke-width="3"/>
      <text x="854" y="140" font-size="16" fill="#1C1C1C">Risk</text><text x="854" y="162" font-size="12" font-weight="400" fill="#444">blended score 0–35+</text><text x="854" y="179" font-size="12" font-weight="400" fill="#444">LOW → CRITICAL</text>

      <rect x="1003" y="116" width="152" height="90" fill="#1C1C1C"/><rect x="997" y="110" width="152" height="90" fill="#BFDBFE" stroke="#1C1C1C" stroke-width="3"/>
      <text x="1073" y="140" font-size="16" fill="#1C1C1C">Approval</text><text x="1073" y="162" font-size="12" font-weight="400" fill="#444">who must sign off,</text><text x="1073" y="179" font-size="12" font-weight="400" fill="#444">in what order</text>
    </g>

    <!-- routing outcomes -->
    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="759" y="226" width="86" height="28" fill="#BBF7D0" stroke="#1C1C1C" stroke-width="2"/><text x="802" y="245" fill="#1C1C1C">LOW: auto</text>
      <rect x="853" y="226" width="110" height="28" fill="#FEF08A" stroke="#1C1C1C" stroke-width="2"/><text x="908" y="245" fill="#1C1C1C">MED: Manager</text>
      <rect x="971" y="226" width="184" height="28" fill="#FCA5A5" stroke="#1C1C1C" stroke-width="2"/><text x="1063" y="245" fill="#1C1C1C">HIGH+: Manager → Finance</text>
    </g>
    <text x="45" y="244" font-size="12" fill="#444">Hard-violation floor: any single line &gt; 5% over its ceiling forces at least Sales Manager review,</text>
    <text x="45" y="261" font-size="12" fill="#444">so one bad line can't hide behind many compliant ones.</text>

    <!-- elbow to lane 2 -->
    <path d="M1073 266V288H178V318" stroke="#1C1C1C" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/></path>
    <text x="620" y="282" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="middle">APPROVED → customer or rep confirms</text>

    <text x="45" y="312" font-size="14" font-weight="800" letter-spacing="2" fill="#1D4ED8">2 · EXECUTE</text>

    <!-- lane 2 -->
    <g stroke="#1C1C1C" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M283 385H335"/><path d="M563 385H615"/><path d="M843 385H895"/>
    </g>
    <circle r="7" fill="#16A34A" stroke="#1C1C1C" stroke-width="2.5"><animateMotion dur="5s" repeatCount="indefinite" path="M60 385H1140"/></circle>

    <g font-weight="800" text-anchor="middle">
      <rect x="66" y="346" width="224" height="80" fill="#1C1C1C"/><rect x="60" y="340" width="224" height="80" fill="#fff" stroke="#1C1C1C" stroke-width="3"/>
      <text x="172" y="370" font-size="16" fill="#1C1C1C">Order created</text><text x="172" y="392" font-size="12" font-weight="400" fill="#444">quote → CONFIRMED,</text><text x="172" y="408" font-size="12" font-weight="400" fill="#444">in one transaction</text>

      <rect x="346" y="346" width="224" height="80" fill="#1C1C1C"/><rect x="340" y="340" width="224" height="80" fill="#FEF08A" stroke="#1C1C1C" stroke-width="3"/>
      <text x="452" y="370" font-size="16" fill="#1C1C1C">Fulfilment</text><text x="452" y="392" font-size="12" font-weight="400" fill="#444">greedy, largest stock first,</text><text x="452" y="408" font-size="12" font-weight="400" fill="#444">explicit backorder</text>

      <rect x="626" y="346" width="224" height="80" fill="#1C1C1C"/><rect x="620" y="340" width="224" height="80" fill="#BBF7D0" stroke="#1C1C1C" stroke-width="3"/>
      <text x="732" y="370" font-size="16" fill="#1C1C1C">Billing</text><text x="732" y="392" font-size="12" font-weight="400" fill="#444">one-time invoice +</text><text x="732" y="408" font-size="12" font-weight="400" fill="#444">recurring subscriptions</text>

      <rect x="906" y="346" width="224" height="80" fill="#1C1C1C"/><rect x="900" y="340" width="224" height="80" fill="#BFDBFE" stroke="#1C1C1C" stroke-width="3"/>
      <text x="1012" y="370" font-size="16" fill="#1C1C1C">Deal health</text><text x="1012" y="392" font-size="12" font-weight="400" fill="#444">watches stalls, churn,</text><text x="1012" y="408" font-size="12" font-weight="400" fill="#444">slipped delivery</text>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="467" rx="10" fill="none" stroke="#1C1C1C" stroke-width="3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
