<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DealFlow360 banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1C1C1C" fill-opacity="0.14"/></pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Arial Black','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="300" fill="#F4F3EF"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- moving hazard stripe -->
    <g>
      <rect x="-60" y="272" width="1320" height="28" fill="#1C1C1C"/>
      <g fill="#FACC15">
        <path d="M0 272h28l-28 28z M56 272h28l-28 28z M112 272h28l-28 28z M168 272h28l-28 28z M224 272h28l-28 28z M280 272h28l-28 28z M336 272h28l-28 28z M392 272h28l-28 28z M448 272h28l-28 28z M504 272h28l-28 28z M560 272h28l-28 28z M616 272h28l-28 28z M672 272h28l-28 28z M728 272h28l-28 28z M784 272h28l-28 28z M840 272h28l-28 28z M896 272h28l-28 28z M952 272h28l-28 28z M1008 272h28l-28 28z M1064 272h28l-28 28z M1120 272h28l-28 28z M1176 272h28l-28 28z"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="56 0" dur="2.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- title with hard shadow -->
    <text x="606" y="144" text-anchor="middle" font-size="108" font-weight="900" fill="#1D4ED8" letter-spacing="-2">DealFlow360</text>
    <text x="600" y="138" text-anchor="middle" font-size="108" font-weight="900" fill="#F4F3EF" stroke="#1C1C1C" stroke-width="5" paint-order="stroke" letter-spacing="-2">DealFlow360</text>

    <text x="600" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="#1C1C1C" letter-spacing="2" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AI-ASSISTED B2B QUOTING · APPROVALS · FULFILMENT · BILLING</text>

    <!-- stage chips -->
    <g font-size="15" font-weight="900" text-anchor="middle">
      <g><rect x="272" y="212" width="150" height="40" fill="#1C1C1C"/><rect x="266" y="206" width="150" height="40" fill="#FFFFFF" stroke="#1C1C1C" stroke-width="3"/><text x="341" y="232" fill="#1C1C1C">QUOTE</text>
        <animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0s" repeatCount="indefinite"/></g>
      <g><rect x="458" y="212" width="150" height="40" fill="#1C1C1C"/><rect x="452" y="206" width="150" height="40" fill="#BFDBFE" stroke="#1C1C1C" stroke-width="3"/><text x="527" y="232" fill="#1C1C1C">APPROVE</text>
        <animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="1s" repeatCount="indefinite"/></g>
      <g><rect x="644" y="212" width="150" height="40" fill="#1C1C1C"/><rect x="638" y="206" width="150" height="40" fill="#FEF08A" stroke="#1C1C1C" stroke-width="3"/><text x="713" y="232" fill="#1C1C1C">FULFIL</text>
        <animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="2s" repeatCount="indefinite"/></g>
      <g><rect x="830" y="212" width="150" height="40" fill="#1C1C1C"/><rect x="824" y="206" width="150" height="40" fill="#BBF7D0" stroke="#1C1C1C" stroke-width="3"/><text x="899" y="232" fill="#1C1C1C">BILL</text>
        <animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="3s" repeatCount="indefinite"/></g>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="10" fill="none" stroke="#1C1C1C" stroke-width="3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
